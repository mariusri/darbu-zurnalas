      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Įdiegti priklausomybes
        run: npm install

      - name: Įdėti Supabase biblioteką
        run: |
          mkdir -p www/vendor
          F=node_modules/@supabase/supabase-js/dist/umd/supabase.js
          if [ ! -f "$F" ]; then F=$(find node_modules/@supabase/supabase-js/dist -path '*umd*' -name '*.js' | head -1); fi
          test -n "$F" || { echo "Nerasta Supabase biblioteka"; exit 1; }
          cp "$F" www/vendor/supabase.js

      - name: Sugeneruoti ikonas
        run: |
          pip install --quiet pillow
          python3 scripts/make_icons.py

      - name: Sukurti Android projektą
        run: npx cap add android

      - name: Ikonos, versija ir parašo raktas
        run: |
          cp -r android-res/* android/app/src/main/res/
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          mkdir -p ~/.android && cp android-build/debug.keystore ~/.android/debug.keystore

      - name: Sinchronizuoti
        run: npx cap sync android

      - name: Sukompiliuoti APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Paruošti failą
        run: cp android/app/build/outputs/apk/debug/app-debug.apk darbu-zurnalas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: darbu-zurnalas-apk
          path: darbu-zurnalas.apk

      - name: Paskelbti atsisiuntimui (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest darbu-zurnalas.apk --title "Darbų žurnalas – naujausia versija" --notes "Versija 1.${{ github.run_number }}"
